name: Build, publish, and deploy image (prod)

# Pushes to main are the production release. This builds the image,
# pushes it to the DSA infrastructure's private ECR repo, and pokes
# Coolify's deploy webhook to pull the new :main tag on the prod
# worker. See docs/deploy/coolify.md and dsa-infrastructure's
# GITHUB_ACTIONS_ECR_COOLIFY_RUNBOOK.md for the full flow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: capvmt_v2.0

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          FONTAWESOME_AUTH_TOKEN: ${{ secrets.FONTAWESOME_AUTH_TOKEN }}
        with:
          context: .
          file: web/Dockerfile
          push: true
          secrets: |
            npm_auth_token=${{ secrets.NPM_AUTH_TOKEN }}
            fontawesome_auth_token=${{ secrets.FONTAWESOME_AUTH_TOKEN }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}

      - name: Deploy to production
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_PROD_TOKEN }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
