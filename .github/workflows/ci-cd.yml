name: CI/CD

# `test` and `build` run on every push/PR and need no infra setup.
#
# There's no `deploy` job here: deploy-dev.yml and deploy-prod.yml
# handle that (build -> push to ECR -> Coolify webhook), triggered by
# push to dev/main respectively - see docs/deploy/coolify.md. This
# workflow's `build` job only validates the Dockerfile still builds;
# it never pushes an image.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx --workspace web playwright install --with-deps chromium

      - name: Lint
        run: npm run lint --workspace web --if-present

      - name: Test
        run: npm test --workspace web

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: capvmt-web:ci
