name: CI/CD

# `test` and `build` run on every push/PR and need no infra setup.
#
# There's no `deploy` job: this app deploys as a single Coolify
# application that builds directly from this repo's git history (see
# docs/deploy/coolify.md), not by this workflow pushing an image
# somewhere - Coolify's own webhook/git integration triggers that build.

on:
  push:
    branches: [main, modernization]
  pull_request:
    branches: [main, modernization]
  workflow_dispatch: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx --workspace web playwright install --with-deps chromium

      - name: Lint
        run: npm run lint --workspace web --if-present

      - name: Test
        run: npm test --workspace web

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: capvmt-web:ci
